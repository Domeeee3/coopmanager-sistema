name: Release desktop

# Publica una versión al subir una etiqueta como v1.2.0.
# Genera el instalador de Windows y lo sube a GitHub Releases junto con
# latest.yml, que la app instalada usa para actualizarse sola. La versión se
# crea como borrador y sólo se hace pública cuando todos los archivos subieron.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión v${version} de package.json." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder sube varios archivos en paralelo; si la versión no
      # existe, cada subida crea su propio borrador y los archivos quedan
      # repartidos. Crear el borrador antes evita esa carrera.
      - name: Create draft release
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes "CoopManager ${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish installer
        run: pnpm release:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: bash
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          echo "$assets"
          version="${GITHUB_REF_NAME#v}"
          for file in "CoopManager-Setup-${version}.exe" "latest.yml"; do
            if ! grep -qx "$file" <<<"$assets"; then
              echo "Falta $file en la versión; no se publica." >&2
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
